[Poem]
ItemTitle0=七佛通戒偈
ItemAutor0=诸佛世尊（出《增一阿含经》卷四十四）
ItemContent0=诸恶莫作，众善奉行，自净其意，是诸佛教。

ItemTitle1=莫作恶偈
ItemAutor1=观音菩萨（出《大般若经》意）
ItemContent1=莫作诸恶，修诸善法，自净其意，是诸佛教。

ItemTitle2=福行偈
ItemAutor2=弥勒佛（出《佛说弥勒大成佛经》）
ItemContent2=福为最胜宝，福称无尽藏；福如彼明灯，福同于父母。

ItemTitle3=众善偈
ItemAutor3=阿弥陀佛（出《佛说无量寿经》意）
ItemContent3=众善应可爱，如父复如母；美善体安然，能离于喧诤。

ItemTitle4=动念偈
ItemAutor4=普贤菩萨（出《法句经·双品》改编）
ItemContent4=一念善，福虽未至，祸已远离；一念恶，祸虽未至，福已远离。

ItemTitle5=消业偈
ItemAutor5=阿弥陀佛（出《法句经·恶行品》）
ItemContent5=一毫之恶，劝人莫作；一毫之善，与人方便。

ItemTitle6=积善偈
ItemAutor6=阿弥陀佛（出《周易·坤卦》文言，佛化引用）
ItemContent6=积善之家，必有余庆；积不善之家，必有余殃。

ItemTitle7=善业偈
ItemAutor7=阿弥陀佛（出《佛说十善业道经》）
ItemContent7=修十善业，离诸恶道，成就一切善法。

ItemTitle8=戒恶偈
ItemAutor8=阿弥陀佛（出《法句经·双品》）
ItemContent8=不为恶行者，是谓梵行人；常行善法者，现世得安乐。

ItemTitle9=吉祥偈
ItemAutor9=阿弥陀佛（出《佛说吉祥经》）
ItemContent9=去恶从就善，避酒知自节，不淫于女色，是为最吉祥。

ItemTitle10=近贤偈
ItemAutor10=阿弥陀佛（出《法句经·教学品》）
ItemContent10=贤夫染人，如近香熏，进智习善，行成芳洁。

ItemTitle11=业行偈
ItemAutor11=阿弥陀佛（出《法句经·双品》）
ItemContent11=一切恶莫作，一切善应修，遍调于自心，是则诸佛教。

ItemTitle12=善言偈
ItemAutor12=阿弥陀佛（出《杂阿含经》意）
ItemContent12=口宣仁慈，不演恶言；心念善法，不怀恶意。

ItemTitle13=慈心偈
ItemAutor13=阿弥陀佛（出《法句经·慈仁品》）
ItemContent13=心莫怀嫉妒，口勿说恶言；教多人行善，常修慈心。

ItemTitle14=心净偈
ItemAutor14=阿弥陀佛（出《维摩诘所说经·佛国品》）
ItemContent14=心清净故，世界清净；心杂染故，世界杂染。

ItemTitle15=善恶报偈
ItemAutor15=阿弥陀佛（出《法句经·恶行品》）
ItemContent15=善恶之报，如影随形；三世因果，循环不失。

ItemTitle16=布施偈
ItemAutor16=阿弥陀佛（出《佛遗教经》意）
ItemContent16=布施为福业，持戒为安宅，忍辱为大力，精进为净行。

ItemTitle17=修善偈
ItemAutor17=阿弥陀佛（出《法句经·双品》）
ItemContent17=修善者安，行恶者危；修善者乐，行恶者苦。

ItemTitle18=戒心偈
ItemAutor18=阿弥陀佛（出《法句经·心意品》）
ItemContent18=护意如守城，防心如防盗；一念不善生，速急令灭除。

ItemTitle19=净心偈
ItemAutor19=阿弥陀佛（出《维摩诘经》意）
ItemContent19=心净则佛土净，心善则国土善。

ItemTitle20=离恶偈
ItemAutor20=阿弥陀佛（出《十善业道经》）
ItemContent20=远离杀盗淫，妄语两舌等，一切诸恶业，悉皆不造作。

ItemTitle21=善根偈
ItemAutor21=阿弥陀佛（出《华严经·净行品》意）
ItemContent21=修诸善根，远离诸恶，常行慈悲，利益众生。

ItemTitle22=慈心偈
ItemAutor22=地藏菩萨（出《地藏菩萨本愿经》）
ItemContent22=慈心不杀，修十善业，孝顺父母，奉事师长。

ItemTitle23=善恶果偈
ItemAutor23=地藏菩萨（出《地藏菩萨本愿经》）
ItemContent23=莫造诸恶业，后世堕恶道；勤修诸善根，往生善趣中。

ItemTitle24=修福偈
ItemAutor24=药师琉璃光如来（出《药师琉璃光如来本愿功德经》）
ItemContent24=修诸福业，远离邪见，不杀不盗，持戒清净。

ItemTitle25=善根偈
ItemAutor25=佛说阿弥陀（出《佛说阿弥陀经》）
ItemContent25=不可以少善根福德因缘，得生彼国。

ItemTitle26=三福偈
ItemAutor26=观无量寿佛（出《佛说观无量寿佛经》）
ItemContent26=孝养父母，奉事师长，慈心不杀，修十善业。

ItemTitle27=持戒偈
ItemAutor27=佛遗教经（出《佛垂般涅槃略说教诫经》）
ItemContent27=持戒常安，身心清净；远离诸恶，常修众善。

ItemTitle28=善业灭罪偈
ItemAutor28=僧伽吒（出《僧伽吒经》）
ItemContent28=修一善业，灭百千亿劫生死重罪。

ItemTitle29=慈悲偈
ItemAutor29=大悲心陀罗尼（出《千手千眼观世音菩萨广大圆满无碍大悲心陀罗尼经》）
ItemContent29=大慈大悲，救苦救难，广大灵感，利益一切众生。

ItemTitle30=六道偈
ItemAutor30=十善业道经（出《佛说十善业道经》）
ItemContent30=行十恶者，堕地狱饿鬼畜生道；行十善者，生人天阿修罗道。

ItemTitle31=六道因果偈
ItemAutor31=大般涅槃经（出《大般涅槃经》）
ItemContent31=善因得善果，恶因得恶果；行善生天道，造恶堕三涂。

ItemTitle32=鬼道苦偈
ItemAutor32=法集要颂经（出《法集要颂经·有为品》）
ItemContent32=作恶堕鬼道，颈细如针锋，腹大如须弥，饥渴无有救。

ItemTitle33=功德偈
ItemAutor33=功德佛（出《大乘本生心地观经》意）
ItemContent33=恶尽曰功，善满称德；功德圆满，自成佛道。

; ========== 以下为续写偈子 ==========

ItemTitle34=忍辱偈
ItemAutor34=释迦牟尼佛（出《佛遗教经》意）
ItemContent34=忍辱为大力，能伏众恶行；嗔心如火焚，慈悲得清凉。

ItemTitle35=精进偈
ItemAutor35=释迦牟尼佛（出《华严经·普贤行愿品》意）
ItemContent35=日夜常精进，勤修诸善法；懈怠堕恶趣，勇猛至菩提。

ItemTitle36=智慧偈
ItemAutor36=文殊师利菩萨（出《般若波罗蜜多心经》意）
ItemContent36=般若照五蕴，皆空度苦厄；智慧破无明，善法自增长。

ItemTitle37=回向偈
ItemAutor37=普贤菩萨（出《华严经·普贤行愿品》）
ItemContent37=所有功德果，悉与众生共；普愿出轮回，同生极乐国。

ItemTitle38=念佛偈
ItemAutor38=阿弥陀佛（出《佛说无量寿经》）
ItemContent38=念念弥陀佛，心心极乐土；一称灭重罪，十念必往生。

ItemTitle39=持戒偈二
ItemAutor39=毗奈耶藏（出《四分律》意）
ItemContent39=戒为无上菩提本，长养一切诸善根；身口意业常清净，即是如来真弟子。

ItemTitle40=忏悔偈
ItemAutor40=观世音菩萨（出《大悲忏法》意）
ItemContent40=往昔所造诸恶业，皆由无始贪嗔痴；从身语意之所生，今对佛前求忏悔。

ItemTitle41=知足偈
ItemAutor41=释迦牟尼佛（出《佛遗教经》）
ItemContent41=知足之人虽卧地，犹为安乐；不知足者处天堂，亦不称意。

ItemTitle42=放生偈
ItemAutor42=药师琉璃光如来（出《药师经》意）
ItemContent42=慈心救物命，放生增福寿；众生皆佛性，莫杀修慈悲。

ItemTitle43=和合偈
ItemAutor43=释迦牟尼佛（出《四分律》意）
ItemContent43=和合众僧伽，无诤生善法；六和敬为基，正法得久住。

ItemTitle44=无常偈
ItemAutor44=释迦牟尼佛（出《法句经·无常品》）
ItemContent44=一切世间动，人心亦无常；及时修善行，莫待命终慌。

ItemTitle45=发愿偈
ItemAutor45=地藏菩萨（出《地藏菩萨本愿经》意）
ItemContent45=众生度尽，方证菩提；地狱未空，誓不成佛。